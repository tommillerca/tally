# Boneheadz Gym social API (Cloudflare Worker + D1).
# TESTS AGAINST THE LIVE API mint only INVISIBLE accounts. Every suite binds
# IS_TEST = flagFor(BASE) from server/test-flag.mjs and passes it as {test:...}
# on POST /register: local runs are unflagged, anything else lands
# players.is_test=1 and never appears on any public surface.
# tests/live-api-register-lint.mjs fails the release gate if a suite forgets.
# See docs/BOT-CENSUS-2026-08-22.md for what forgetting did four times.
# Local dev needs NO account:  npm run db:local && npm run dev
# Production deploy (once Tom's Cloudflare account exists):
#   npx wrangler d1 create bonez   -> paste database_id below
#   npx wrangler d1 execute bonez --remote --file=schema.sql
#   npx wrangler deploy
name = "bonez-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "bonez"
database_id = "703a4e46-7643-490c-8d3f-26bc4e277eba"

# EVENTS RETENTION. Drives scheduled() in src/index.js, which is the only thing
# on this worker that deletes anything. Nothing had ever pruned the events table,
# so it grew without a ceiling, and D1's 10 GB per-database limit is a hard stop
# that cannot be raised by paying for it.
#
# Every 15 minutes, not hourly, because each tick is deliberately bounded to
# 50,000 rows: 96 ticks a day is 4.8M rows of pruning capacity against a
# steady-state need of roughly 760k rows a day at 10,000 DAU. The surplus is the
# point. It means the pruner can drain a backlog rather than only keep pace with
# one, and a tick that finds nothing to do costs three queries and exits.
# OFF FOR THE BOT-FLAG DEPLOY, 2026-08-24. Tom: "sure split the D1 work and get
# the bot flag done." The split is exactly this line. Hiding the 47 test accounts
# is additive and reversible; the pruner DELETES rows from a live database with
# real players in it and has never once run against real data. Deploying the
# filter does not require the pruner, so the pruner waits for a deliberate
# decision and somebody watching it.
# TO TURN IT ON: uncomment, redeploy, and watch the first tick.
[triggers]
crons = ["*/15 * * * *"]

# WORKERS LOGS. Without this block Cloudflare retains NOTHING: `wrangler tail`
# is a live stream and everything printed while nobody is attached is gone. That
# is exactly what happened the day the cron above was turned on. Three tail
# sessions failed to observe a single tick and there was no second place to
# look, so "did the pruner run last night" was unanswerable rather than merely
# inconvenient.
#
# head_sampling_rate = 1 keeps every invocation, and it can afford to: this
# worker's cron is 96 invocations a day and its fetch traffic is a handful of
# players. Sampling exists for workers doing millions of requests; here it would
# only introduce a chance that the one failed tick is the one that was dropped.
#
# This is the LIVE half. The durable half is the prune_runs table and
# GET /admin/prune, which outlive log retention and can be queried rather than
# read. Neither replaces the other: logs catch a worker that fails before it can
# write a row, the table answers questions a week of log text cannot.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# DEV enables /dev/* test endpoints. NEVER set in production.
DEV = "0"
