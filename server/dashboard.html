<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boneheadz Gym — Analytics</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0c12; color: #e8e2d6; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 { font-size: 24px; letter-spacing: 0.5px; }
  .setup { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 22px; }
  input { flex: 1; min-width: 200px; background: #17151f; border: 1px solid #2a2733; color: #e8e2d6; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  button { background: #a5e847; color: #10130a; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 800; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .card { background: #17151f; border: 1px solid #2a2733; border-radius: 14px; padding: 16px; }
  .card .n { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .card .l { color: #9a94a6; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  h2 { font-size: 15px; color: #a5e847; margin: 30px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .bar-row .k { width: 130px; font-size: 13px; color: #cfc6d6; text-align: right; flex: none; }
  .bar-row .bar { flex: 1; background: #221f2c; border-radius: 5px; overflow: hidden; height: 20px; }
  .bar-row .bar i { display: block; height: 100%; background: linear-gradient(90deg,#6f86c9,#a5e847); border-radius: 5px; }
  .bar-row .v { width: 46px; font-weight: 800; font-size: 13px; }
  .note { color: #6f6a7a; font-size: 12px; margin-top: 8px; }
  .rpt { background: #17151f; border: 1px solid #2a2733; border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
  .rtag { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 2px 8px; border-radius: 999px; margin-right: 8px; vertical-align: 1px; }
  .rtag.den { background: #2e3a1a; color: #a5e847; }
  .rtag.unreach { background: #3a2020; color: #ff9a8a; }
  .rtag.fb { background: #1e2f3a; color: #7cc4ff; }
  .rtag.no { background: #2a2733; color: #9a94a6; }
  .rnote { color: #e8e2d6; }
  .lead-sum { background: #17151f; border: 1px solid #2a2733; border-radius: 12px; padding: 12px 14px; margin: 6px 0 10px; font-size: 14px; }
  .lead-sum b { color: #d7a6ff; }
  .mini { font-size: 12px; padding: 5px 10px; margin-left: 8px; background: #b96cf0; color: #1a0f26; border-radius: 8px; }
  .rpt.lead .lead-head { font-size: 15px; margin-bottom: 6px; }
  .lead-field { display: flex; gap: 8px; margin: 4px 0; }
  .lead-k { flex: none; width: 78px; color: #9a94a6; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 1px; }
  .lead-v { color: #e8e2d6; }
  .lead-feats { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
  .feat-chip { display: inline-block; font-size: 12px; background: #241b30; color: #d7a6ff; border: 1px solid #3a2d4d; border-radius: 999px; padding: 3px 9px; }
  .feat-chip b { color: #fff; margin-left: 2px; }
  .feat-tally { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  /* Survey v2: one block per question, and the tracked number on its own. */
  .q-block { margin: 14px 0 18px; }
  .q-head { font-size: 13px; color: #cfc6d6; font-weight: 700; margin-bottom: 6px; }
  .q-n { color: #6f6a7a; font-weight: 400; margin-left: 6px; }
  .q-pct { color: #6f6a7a; font-weight: 400; }
  .q-block .bar-row .k { width: 240px; }
  .lead-sum.q5 { border-color: #3a5a1a; }
  .lead-sum.q5 b { color: #a5e847; font-size: 16px; }
  select.mini { -webkit-appearance: none; appearance: none; border: none; }
  .rmeta { color: #6f6a7a; font-size: 12px; margin-top: 6px; }
  .rmeta a { color: #7cc4ff; }
  .err { color: #ff8080; }
  /* Retention health. Deliberately the first thing on the page and deliberately
     colour-coded: the question it answers is "is anything deleting rows", and a
     "no" that reads like every other number would go unread for months. */
  .health { border-radius: 14px; padding: 14px 16px; margin: 0 0 18px; border: 1px solid; }
  .health .hs { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
  .health .hd { color: #e8e2d6; margin-top: 4px; font-size: 13.5px; }
  .health .hm { color: #9a94a6; font-size: 12px; margin-top: 8px; }
  .health.ok   { background: #16210f; border-color: #2e4a19; } .health.ok .hs   { color: #a5e847; }
  .health.warn { background: #241d0f; border-color: #4a3a19; } .health.warn .hs { color: #ffc857; }
  .health.bad  { background: #2a1414; border-color: #4d2222; } .health.bad .hs  { color: #ff8080; }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 14px; }
  .tbl th { text-align:left; opacity:.6; font-weight:600; padding:4px 8px 4px 0; border-bottom:1px solid rgba(128,128,128,.3); }
  .tbl td { padding:5px 8px 5px 0; border-bottom:1px solid rgba(128,128,128,.15); vertical-align:top; }
  .tbl td.msg { max-width:34em; }
  .tbl td.src { opacity:.65; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; }
</style>
</head>
<body>
<main>
  <h1>🎮 Boneheadz Gym — Analytics</h1>
  <div class="setup">
    <input id="api" placeholder="Worker URL, e.g. https://bonez-api.you.workers.dev">
    <input id="token" placeholder="Admin token" type="password">
    <button id="go">Load</button>
  </div>
  <div id="out"></div>
  <p class="note">Private. Your Worker URL is saved in this browser; the admin token only for this tab. Numbers are anonymous device counts.</p>
</main>
<script>
  const $ = s => document.querySelector(s);
  $('#api').value = localStorage.bhApi || 'https://bonez-api.boneheadz.workers.dev';
  /* QA round 29 S2: the token was in localStorage on the game's own Pages
     origin, forever. sessionStorage now: it survives a reload of this tab and
     dies with it. The URL stays in localStorage, it is not a secret. */
  $('#token').value = sessionStorage.bhTok || '';
  try { delete localStorage.bhTok; } catch {}
  const bar = (k, v, max) => `<div class="bar-row"><span class="k">${k}</span><span class="bar"><i style="width:${max ? Math.round(v / max * 100) : 0}%"></i></span><span class="v">${v}</span></div>`;
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function load() {
    const api = $('#api').value.trim().replace(/\/$/, ''), tok = $('#token').value.trim();
    if (!api || !tok) { $('#out').innerHTML = '<p class="err">Enter your Worker URL and admin token.</p>'; return; }
    localStorage.bhApi = api; sessionStorage.bhTok = tok;
    // QA round 29 S2: the token travels in a header, never the URL (the worker
    // retains every request URL with head_sampling_rate = 1).
    const auth = { headers: { authorization: 'Bearer ' + tok } };
    $('#out').innerHTML = 'Loading...';
    try {
      const r = await fetch(api + '/stats', auth);
      if (!r.ok) { $('#out').innerHTML = `<p class="err">${r.status === 401 ? 'Wrong admin token.' : 'Error ' + r.status}</p>`; return; }
      const s = await r.json();
      /* RETENTION HEALTH. Separate route, separate failure: an older worker has
         no /admin/prune, so a null here means "cannot tell" and says so rather
         than taking the whole page down. */
      const health = await fetch(api + '/admin/prune?limit=10', auth)
        .then(x => x.ok ? x.json() : null).catch(() => null);
      const actMax = Math.max(1, ...s.activeByDay.map(d => d.n));
      const nameMax = Math.max(1, ...s.byName.map(d => d.n));
      const stime = s.screenTime || [], fopen = s.featureOpens || [], ftime = s.featureTime || [], testers = s.testers || [];
      const stMax = Math.max(1, ...stime.map(d => d.min || 0));
      const foMax = Math.max(1, ...fopen.map(d => d.n || 0));
      const ftMax = Math.max(1, ...ftime.map(d => d.min || 0));
      const hrs = m => m >= 60 ? (m / 60).toFixed(1) + 'h' : m + 'm';
      // ---- survey leads digest: a summary line + one clean card per response ----
      const FEAT_LABELS = { log:'Logging food', steps:'Walking / steps', pit:'The Pit', boneyard:'The Boneyard', pets:'Pets / Stable', kitchen:'The Kitchen', crew:'The Crew', quests:'Quests / wheel' };
      const featList = l => (l.features ? String(l.features).split(',').filter(Boolean) : []);
      const allLeads = s.leads || [];
      /* SURVEY V2. Two surveys asked different questions of overlapping people,
         so a single averaged list would be a number with no meaning: the form
         filter below is not a convenience, it is what keeps v1 and v2 apart.
         Every row the server hands back carries a form (NULL coalesced to
         'dayone' in the select), so the buckets are exhaustive. */
      const FORM_LABELS = { dayone: 'Day One survey (v1)', v2: "The player report (v2)" };
      /* The v2 answer keys, in the order the sheet asks them. These MUST match
         what the client posts in `answers`; a key here with no data renders as
         "not answered" rather than vanishing, which is how a client/server
         drift shows up on the page instead of silently halving n. */
      const Q_LABELS = {
        q1: 'Why did you open the app today?',
        q2: 'What keeps you coming back? (up to 2)',
        q3: 'Anything you did not understand?',
        q4: 'If we cut one thing, what should go?',
        q5: 'Will you still be playing in a month?',
      };
      // Free text is listed, never tallied: two people never phrase it the same.
      const FREE_LABELS = { q3text: 'Q3 · what was confusing', q6: 'Q6 · what nearly made them stop' };
      const Q5_YES = ['definitely', 'probably'];   // the numerator of the one tracked number
      const answersOf = l => { try { return JSON.parse(l.answers) || {}; } catch { return {}; } };
      const asList = v => v == null || v === '' ? [] : (Array.isArray(v) ? v.filter(x => typeof x === 'string') : [String(v)]);
      /* One question's tally: option, count, percent of the people who ANSWERED
         IT (not of everyone), because every question is skippable and dividing
         by the wrong n is how a survey lies. Multi-select questions have counts
         that sum past n on purpose. */
      const qTally = (rows, key) => {
        const counts = {}; let answered = 0;
        rows.forEach(l => {
          const vals = asList(answersOf(l)[key]);
          if (!vals.length) return;
          answered++;
          vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
        });
        const ordered = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        if (!answered) return `<div class="q-block"><div class="q-head">${esc(Q_LABELS[key])} <span class="q-n">nobody answered</span></div></div>`;
        const max = ordered[0][1];
        return `<div class="q-block"><div class="q-head">${esc(Q_LABELS[key])} <span class="q-n">n=${answered}</span></div>`
          + ordered.map(([opt, n]) => bar(`${esc(opt)} <span class="q-pct">${Math.round(n / answered * 100)}%</span>`, n, max)).join('')
          + '</div>';
      };
      const freeList = (rows, key) => {
        const items = rows.map(l => ({ who: l.name || l.label || 'anonymous', t: answersOf(l)[key] }))
          .filter(x => typeof x.t === 'string' && x.t.trim());
        if (!items.length) return '';
        return `<div class="q-block"><div class="q-head">${esc(FREE_LABELS[key])} <span class="q-n">${items.length}</span></div>`
          + items.map(x => `<div class="rpt lead"><div class="lead-v">${esc(x.t)}</div><div class="rmeta">${esc(x.who)}</div></div>`).join('')
          + '</div>';
      };
      function renderV2(rows) {
        // Q5 first and alone: it is the one number watched release over release.
        const q5 = rows.map(l => answersOf(l).q5).filter(v => typeof v === 'string' && v);
        const yes = q5.filter(v => Q5_YES.includes(v.toLowerCase())).length;
        const q5line = q5.length
          ? `<div class="lead-sum q5"><b>Still playing in a month: ${Math.round(yes / q5.length * 100)}%</b> (n=${q5.length})</div>`
          : '';
        return q5line + Object.keys(Q_LABELS).map(k => qTally(rows, k)).join('')
          + Object.keys(FREE_LABELS).map(k => freeList(rows, k)).join('');
      }
      /* v1 rows keep the card-per-response shape they always had: five fixed
         questions, two of them free text, and eleven of them is a readable
         list. Only v2 is big enough to need tallying. */
      function renderV1(leads) {
      const optedEmails = [...new Set(leads.filter(l => l.optin && l.email).map(l => l.email))];
      const withEmail = leads.filter(l => l.email).length;
      // feature-usage tally across all responses, most-used first
      const featTally = {};
      leads.forEach(l => featList(l).forEach(f => { featTally[f] = (featTally[f] || 0) + 1; }));
      const featRows = Object.entries(featTally).sort((a,b) => b[1]-a[1])
        .map(([f,n]) => `<span class="feat-chip">${esc(FEAT_LABELS[f] || f)} <b>${n}</b></span>`).join('');
      const leadsSummary = leads.length
        ? `<div class="lead-sum"><b>${leads.length}</b> response${leads.length === 1 ? '' : 's'} · <b>${withEmail}</b> left an email · <b>${optedEmails.length}</b> opted in to updates${optedEmails.length ? ` <button id="copyEmails" class="mini">Copy ${optedEmails.length} opted-in email${optedEmails.length === 1 ? '' : 's'}</button>` : ''}${featRows ? `<div class="feat-tally">Features in use: ${featRows}</div>` : ''}</div>`
        : '';
      const leadsHtml = leads.length ? leads.map(l => {
        const who = l.name || l.label || 'anonymous';
        const mail = l.email
          ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.optin ? ' <span class="rtag den">opted in</span>' : ' <span class="rtag no">no updates</span>'}`
          : '<span class="rmeta">no email</span>';
        const feats = featList(l);
        const featChips = feats.length ? `<div class="lead-feats">${feats.map(f => `<span class="feat-chip">${esc(FEAT_LABELS[f] || f)}</span>`).join('')}</div>` : '';
        const fb = l.feedback ? `<div class="lead-field"><span class="lead-k">Thinks</span><span class="lead-v">${esc(l.feedback)}</span></div>` : '';
        const want = l.mostWanted ? `<div class="lead-field"><span class="lead-k">Wants next</span><span class="lead-v">${esc(l.mostWanted)}</span></div>` : '';
        const meta = [l.label ? 'Crew: ' + esc(l.label) : '', l.geo ? esc(l.geo) : '', new Date(l.ts).toLocaleString()].filter(Boolean).join(' · ');
        return `<div class="rpt lead"><div class="lead-head"><b>${esc(who)}</b> · ${mail}</div>${featChips}${fb}${want}<div class="rmeta">${meta}</div></div>`;
      }).join('') : '<p class="note">No survey responses yet.</p>';
        return leadsSummary + leadsHtml;
      }
      /* Which forms actually have rows, newest form first, so the filter offers
         only buckets that exist and lands on the survey currently running. */
      const formsPresent = [...new Set(allLeads.map(l => l.form || 'dayone'))];
      let leadForm = formsPresent[0] || 'dayone';
      const formPicker = formsPresent.length > 1
        ? `<select id="leadForm" class="mini">${formsPresent.map(f => `<option value="${esc(f)}">${esc(FORM_LABELS[f] || f)} (${allLeads.filter(l => (l.form || 'dayone') === f).length})</option>`).join('')}</select>`
        : '';
      function paintLeads() {
        const rows = allLeads.filter(l => (l.form || 'dayone') === leadForm);
        const box = document.getElementById('leadsBox');
        if (!box) return;
        box.innerHTML = leadForm === 'dayone' ? renderV1(rows) : renderV2(rows);
        /* Re-bound on every paint: the button lives inside the HTML this just
           replaced, so a listener attached once would be dead after a filter
           change. Its clipboard payload is the FILTERED set, deliberately. */
        const copyBtn = document.getElementById('copyEmails');
        if (copyBtn) {
          const mails = [...new Set(rows.filter(l => l.optin && l.email).map(l => l.email))];
          copyBtn.onclick = async () => {
            try { await navigator.clipboard.writeText(mails.join(', ')); copyBtn.textContent = 'Copied ✓'; }
            catch { copyBtn.textContent = mails.join(', '); }
          };
        }
      }
      /* TWO WINDOWS, AND A LABEL HAS TO SAY WHICH ONE IT MEANS.
         windowDays is how long the events table KEEPS rows (the retention
         cron). statsWindowDays is how far back /stats CHOSE to read, which is
         shorter, because the tester leaderboard crossed D1's 30 second
         statement limit at 12M rows. Both come off the response rather than
         being typed here, so neither can drift from the constant that produced
         it. "Testers (all time)" was the original version of this mistake: it
         read as a launch-to-date total and had quietly become "testers seen in
         the last 60 days".
         The four all-time figures below (Testers seen, Came back, New players
         by day, and each tester's first/last) now come off the `devices` table,
         which the pruner never touches, so they carry NO window suffix and are
         true again. Everything counted out of `events` carries the stats
         window. */
      const win = Number(s.windowDays) || 0;
      const sw = Number(s.statsWindowDays) || win;
      const inWin = sw ? ` (last ${sw}d)` : '';
      /* ONE BANNER, AT THE TOP, IN WORDS. The cron was turned on and for a day
         nobody could establish whether a single tick had fired, because the only
         record was a console line in a stream nobody was attached to. The whole
         point of this block is that the answer arrives without anyone knowing
         what a cron is. */
      const ago = ms => ms == null ? 'never' : ms < 90000 ? 'just now'
        : ms < 5400000 ? Math.round(ms / 60000) + ' min ago' : Math.round(ms / 3600000) + ' h ago';
      const healthHtml = (() => {
        if (!health) return `<div class="health warn"><div class="hs">Retention: unknown</div>
          <div class="hd">This worker does not serve <code>/admin/prune</code>, so there is no way to tell from here whether anything is deleting old rows. Deploy a build that includes it.</div></div>`;
        const cls = health.status === 'healthy' ? 'ok' : (health.status === 'behind' ? 'warn' : 'bad');
        const t = health.tables || {};
        /* SAVE SIZE. Nothing prunes the backups table and nothing should: it is
           one row per player, so it grows with player count alone. Tom chose to
           watch the average rather than prune it, and this line is the condition
           that choice was made on. The projected player count comes off the
           CURRENT measured average, so it falls on its own as saves mature; that
           fall is the number to watch, not the absolute figure. Silently absent
           on an older worker, like everything else in this block. */
        const kb = b => b == null ? '?' : b >= 1048576 ? (b / 1048576).toFixed(2) + ' MB' : Math.round(b / 1024).toLocaleString() + ' KB';
        const bk = t.backups;
        const bkLine = !bk ? '' : `<div class="hm">Saves: <b>${bk.rows.toLocaleString()}</b> rows, ${kb(bk.bytes)} total &middot;
          <b>${kb(bk.avgBytes)}</b> per player, ${kb(bk.maxBytes)} largest &middot; every figure here counts BOTH copies, the live save and the daily archive${bk.withDaily == null ? '' : ` (${bk.withDaily.toLocaleString()} rows have one so far)`} &middot; nothing prunes this table (one row per player, so it grows with player count only).
          At today's average it reaches ${Math.round(bk.budgetFraction * 100)}% of D1's 10 GB at <b>${bk.playersAtBudget == null ? '?' : bk.playersAtBudget.toLocaleString()}</b> players.
          That figure is measured, not forecast: as saves mature it falls, and the fall is the signal.</div>`;
        const rows = (health.runs || []).map(x => `<tr>
            <td>${new Date(x.ts).toLocaleString()}</td>
            <td>${x.ok ? 'ok' : '<span class="err">failed</span>'}</td>
            <td>${(x.ev || 0).toLocaleString()}</td>
            <td>${(x.gr || 0).toLocaleString()}</td>
            <td>${esc(x.evStop || x.grStop || '')}</td>
            <td>${x.ms} ms</td>
            <td class="msg">${esc((x.err || '').split('\n')[0])}</td>
          </tr>`).join('');
        return `<div class="health ${cls}">
          <div class="hs">Retention: ${esc(health.status)}</div>
          <div class="hd">${esc(health.detail)}</div>
          <div class="hm">Last tick ${ago(health.sinceLastMs)} &middot; events ${t.eventsRows == null ? '?' : t.eventsRows.toLocaleString()} rows, oldest ${esc(t.eventsOldestDay || '—')} &middot; grants ${t.grantsRows == null ? '?' : t.grantsRows.toLocaleString()} rows, of which <b>${t.grantsDormant == null ? '?' : t.grantsDormant.toLocaleString() + (t.grantsDormantCapped ? '+' : '')}</b> are unopened gifts still waiting (they expire after ${(health.retention || {}).grantDormantDays ?? '?'} days of BOTH the gift's age and the recipient's silence).</div>
          ${bkLine}
        </div>
        ${rows ? `<details><summary class="note">Last ${health.runs.length} ticks</summary>
          <table class="tbl"><tr><th>when</th><th></th><th>events</th><th>grants</th><th>stopped on</th><th>took</th><th>error</th></tr>${rows}</table>
        </details>` : ''}`;
      })();

      $('#out').innerHTML = healthHtml + `
        <div class="cards">
          <div class="card"><div class="n">${s.totalDevices}</div><div class="l">Testers seen (all time)</div></div>
          <div class="card"><div class="n">${s.dau}</div><div class="l">Active today</div></div>
          <div class="card"><div class="n">${s.wau}</div><div class="l">Active this week</div></div>
          <div class="card"><div class="n">${s.returnRate != null ? s.returnRate + '%' : '—'}</div><div class="l">Came back (all time)</div></div>
          <div class="card"><div class="n">${s.playMinutes != null ? hrs(s.playMinutes) : '—'}</div><div class="l">Play time${inWin}</div></div>
          <div class="card"><div class="n">${s.sessions ?? '—'}</div><div class="l">Sessions${inWin}</div></div>
          <div class="card"><div class="n">${s.avgSessionMin != null ? s.avgSessionMin + 'm' : '—'}</div><div class="l">Avg session</div></div>
          <div class="card"><div class="n">${s.totalEvents.toLocaleString()}</div><div class="l">Events${inWin}</div></div>
        </div>
        ${sw ? `<p class="note">Every card and chart marked <b>(last ${sw}d)</b> counts raw analytics events, and this dashboard reads <b>${sw} days</b> of them: the per-device leaderboard scans the whole table, and at 12M rows it took 34 seconds against D1's 30 second statement limit. Rows themselves are kept for <b>${win} days</b> and then pruned to stay under D1's 10 GB cap, so ${sw} days is a reporting choice and ${win} days is the most that could ever be asked for. <b>Testers seen</b>, <b>Came back</b> and <b>New players by day</b> are the exception: they come off the device register, which is never pruned, so they are genuinely all time.</p>` : ''}
        <h2>Crashes</h2>
        ${(s.errors || []).length ? `
          <p class="note">Grouped by message, newest first. <b>devices</b> is the spread: 1 is one unlucky phone, several is everybody. Not filtered by the developer-device exclusion, because a crash is a crash.</p>
          <table class="tbl"><tr><th>message</th><th>times</th><th>devices</th><th>build</th><th>screen</th><th>where</th><th>last seen</th></tr>
          ${s.errors.map(e => `<tr>
            <td class="msg">${esc(e.msg || '(no message)')}</td>
            <td>${e.n}</td><td>${e.devices}</td><td>${esc(e.build || '?')}</td>
            <td>${esc(e.screen || '—')}</td><td class="src">${esc(e.src || '—')}</td>
            <td>${e.lastTs ? new Date(e.lastTs).toLocaleString() : '—'}</td></tr>`).join('')}
          </table>
          ${(s.errorsByBuild || []).length ? `<p class="note">By build: ${s.errorsByBuild.map(b => `<b>${esc(b.build || '?')}</b> ${b.n} on ${b.devices} device${b.devices === 1 ? '' : 's'}`).join(' · ')}. A message that stops appearing on a newer build is a fix confirming itself.</p>` : ''}
        ` : '<p class="note">No crashes reported. That is either good news or the telemetry not reaching us: check that a build carrying it is actually live.</p>'}

        <h2>Keychain vault (iOS reinstall recovery)</h2>
        ${(s.vault || []).length ? `
          <p class="note">A <b>backfill</b> spike is expected once, when the native build carrying the plugin reaches existing players. A <b>recover</b> trickle after that is the net catching real reinstalls: that is the proof, and it needs nobody to delete their own app.</p>
          <table class="tbl"><tr><th>event</th><th>times</th><th>devices</th><th>build</th><th>first</th><th>last</th></tr>
          ${s.vault.map(v => `<tr><td>${esc(v.name)}</td><td>${v.n}</td><td>${v.devices}</td><td>${esc(v.build || '?')}</td><td>${esc(v.firstDay || '')}</td><td>${esc(v.lastDay || '')}</td></tr>`).join('')}
          </table>
        ` : '<p class="note">Nothing yet, which is correct until a native build ships the BhVault registration. Backfills with zero recovers after a few weeks would itself be a finding.</p>'}

        <h2>Screen time — where testers spend it${inWin}</h2>${stime.length ? stime.map(d => bar(d.s || '?', d.min || 0, stMax)).join('') : '<p class="note">No screen-time data yet (ships in the next app update).</p>'}
        <h2>Feature usage — opens${inWin}</h2>${fopen.length ? fopen.map(d => bar(d.f || '?', d.n || 0, foMax)).join('') : '<p class="note">No feature data yet.</p>'}
        <h2>Feature usage — minutes in each${inWin}</h2>${ftime.length ? ftime.map(d => bar(d.f || '?', d.min || 0, ftMax)).join('') : '<p class="note">No feature-time data yet.</p>'}
        <h2>Active players by day</h2>${s.activeByDay.map(d => bar(d.day, d.n, actMax)).join('') || '<p class="note">No data yet.</p>'}
        <h2>New players by day (first ever seen)</h2>${s.newByDay.map(d => bar(d.day, d.n, Math.max(1, ...s.newByDay.map(x => x.n)))).join('') || '<p class="note">No data yet.</p>'}
        <h2>Every tracked action${inWin}</h2>${s.byName.map(d => bar(d.name, d.n, nameMax)).join('') || '<p class="note">No events yet.</p>'}
        <h2>Testers by country</h2>${(s.byCountry || []).length ? s.byCountry.map(d => bar(d.country, d.n, Math.max(1, ...s.byCountry.map(x => x.n)))).join('') : '<p class="note">No geo yet (fills in as testers on the new build check in).</p>'}
        <h2>Testers by city</h2>${(s.byCity || []).length ? s.byCity.map(d => bar([d.city, d.region, d.country].filter(Boolean).join(', ') || '?', d.n, Math.max(1, ...s.byCity.map(x => x.n)))).join('') : '<p class="note">No city data yet.</p>'}
        <h2>Testers (top 30${inWin})</h2>
        <p class="note">"Played" counts real gameplay (meals logged, fights won, cooks, hatches) — telemetry-only devices show as browsed.</p>
        ${testers.length ? testers.map(t => {
          const who = t.label || ('anon ' + t.device.slice(0, 6));
          const loc = [t.city, t.country].filter(Boolean).join(', ');
          const play = (t.played || 0) > 0 ? `⚔ ${t.played} played` : 'browsed only';
          return bar(`${who}${loc ? ' · ' + loc : ''} · ${play}`, t.events, Math.max(1, ...testers.map(x => x.events)));
        }).join('') : '<p class="note">No testers yet.</p>'}
        <h2>Community feedback &amp; reports</h2>${(s.reports || []).length ? s.reports.map(r => {
          const who = r.label || 'anon';
          const isDen = r.kind === 'den-nominate';
          const tag = isDen ? '<span class="rtag den">den idea</span>' : r.kind === 'feedback' ? '<span class="rtag fb">feedback</span>' : '<span class="rtag unreach">unreachable</span>';
          const coords = (r.lat != null && r.lng != null) ? `<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">${r.lat}, ${r.lng}</a>` : '';
          const meta = [esc(who), r.geo ? esc(r.geo) : '', new Date(r.ts).toLocaleString()].filter(Boolean).join(' · ');
          return `<div class="rpt">${tag}${r.target ? `<b>${esc(r.target)}</b> ` : ''}<span class="rnote">${esc(r.note) || '<i>(no note)</i>'}</span><div class="rmeta">${meta}${coords ? ' · ' + coords : ''}</div></div>`;
        }).join('') : '<p class="note">No reports yet. Testers can press and hold the map to nominate a den or flag an unreachable spot.</p>'}
        <h2>Survey leads 💜 ${formPicker}</h2><div id="leadsBox"></div>
        <p class="note">Names shown for testers who went online (Crew); location is coarse (country/city from IP, no GPS). Updated ${new Date(s.generatedAt).toLocaleString()}</p>`;
      const picker = document.getElementById('leadForm');
      if (picker) { picker.value = leadForm; picker.onchange = () => { leadForm = picker.value; paintLeads(); }; }
      paintLeads();
    } catch (e) { $('#out').innerHTML = `<p class="err">Could not reach the server: ${e.message}</p>`; }
  }
  $('#go').onclick = load;
  if (localStorage.bhApi && sessionStorage.bhTok) load();
</script>
</body>
</html>
