<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Boneheadz Gym</title>
<meta name="description" content="Boneheadz Gym: gamified calorie and macro tracking. Scan, log, earn loot, level up.">
<meta name="theme-color" content="#0d0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boneheadz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- The splash is the first paint, so Bangers must already be in flight before
     the stylesheet asks for it, or "EAT." renders in the fallback face and swaps
     a beat later. -->
<link rel="preload" href="assets/fonts/bangers.woff2" as="font" type="font/woff2" crossorigin>
<!-- BoldPixels is the talk box, and the talk box is on Today, so it is needed on
     the first screen after the splash. 4KB. Credited in Settings (CC BY-SA 4.0). -->
<link rel="preload" href="assets/fonts/boldpixels.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Phone-landscape blocker: native apps are hard-locked to portrait, but
     browsers (iOS Safari especially) ignore the manifest's orientation. This
     cover only matches coarse-pointer devices with a short landscape viewport
     (phones) — desktops and tablets never see it. Pure CSS, no JS. -->
<div id="rotateLock" aria-hidden="true">
  <div class="rl-inner">
    <div class="rl-skull">💀</div>
    <div class="rl-title">TURN ME BACK</div>
    <p>Boneheadz Gym is a portrait kind of game.</p>
  </div>
</div>
<div id="app">
  <main id="screen" class="screen"></main>
  <nav id="tabbar" class="tabbar" aria-label="Main">
    <button class="tab" data-tab="today" aria-label="Today">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 6v11a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1V9z"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="boneyard" aria-label="Boneyard">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-5.8 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.2 12 21 12 21z"/><circle cx="12" cy="10.2" r="2.4"/></svg>
      <span>Boneyard</span>
    </button>
    <button class="fab" id="fab" aria-label="Add food">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <button class="tab" data-tab="friends" aria-label="Crew">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.4 19c0-3 2.5-5.2 5.6-5.2S14.6 16 14.6 19"/><path d="M15.8 5.3a3.2 3.2 0 0 1 0 5.9M17 13.9c2.1.5 3.6 2.3 3.6 5.1"/></svg>
      <span>Crew</span>
      <i class="tab-badge" id="crewBadge" hidden></i>
    </button>
    <button class="tab" data-tab="bonehead" aria-label="Your Bonehead">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6c-4 0-6.9 2.8-6.9 6.6 0 2.3 1 3.8 2 4.8v2.3a1.4 1.4 0 0 0 1.4 1.4h.9v2.3a1.4 1.4 0 0 0 1.4 1.4h2.4a1.4 1.4 0 0 0 1.4-1.4v-2.3h.9a1.4 1.4 0 0 0 1.4-1.4V14c1-1 2-2.5 2-4.8 0-3.8-2.9-6.6-6.9-6.6z"/><circle cx="9.3" cy="9.4" r="1.5"/><circle cx="14.7" cy="9.4" r="1.5"/></svg>
      <span>Bonehead</span>
    </button>
  </nav>
  <!-- Settings is the least-visited destination; it does not need a quarter of the
       bottom bar. A gear pinned to the top corner frees that slot for the game hub. -->
  <button id="gearBtn" class="gear-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2z" fill="none" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
  <div id="sheets"></div>
  <div id="toast" class="toast" hidden></div>
</div>
<noscript><p style="padding:2rem;font-family:system-ui">Boneheadz Gym needs JavaScript enabled.</p></noscript>
<script type="module" src="js/app.js"></script>
<!-- THE DEAD SHELL, AND THE ONE THING THAT CAN SAVE IT.
     2026-08-12: a TestFlight user opened the app for the first time on one bar
     of LTE and got this exact page with nothing in it. app.js is a module, and
     a module whose import graph loses ONE file never executes at all, so the
     static markup above (gear, tab bar) paints and #screen stays empty forever.
     Precaching the missing files fixed it for anyone who has loaded once, but
     it CANNOT help a first-ever open: there is no service worker yet, and if
     the connection is bad enough the worker's own install fails too (measured
     against live: worker never took control, app never came up, reload did not
     help).
     So this is the last line of defence and it is deliberately dumb: plain
     classic script, no imports, nothing that can fail the way app.js just did.
     If the app has not put anything on screen after a while, reload ONCE with a
     cache-busting query so the retry cannot be answered by the same broken
     response. Once only, tracked in sessionStorage, because a reload loop is a
     worse bug than a blank screen: it would burn battery and data and never
     recover on a connection that is genuinely down.
     Costs nothing when the app is healthy: one timer that finds content and
     clears itself.

     THE DELAY IS MEASURED, NOT GUESSED. It shipped as 8s on judgement, so it
     got measured: cold cache, CPU throttled, time until #screen has content.
         x1   427ms      x20  4,372ms
         x4   818ms      x30  7,723ms
         x6  1,207ms     x40  9,968ms
         x10 1,964ms     x50 12,748ms
     8s covered a device about 30x slower than this machine and no more, so a
     40x device would have been reloaded at 8s while its content was arriving
     at 10s: a wasted reload, and worse than useless because the reload is slow
     too. 12s covers past 40x with the same behaviour everywhere else. The cost
     of the extra four seconds falls only on a genuinely dead shell, which is
     already broken and waiting either way. -->
<script>
(function () {
  var KEY = 'bhg-shell-retry';
  // a module error is the specific symptom, but do not depend on catching it:
  // the check below is about the OUTCOME (nothing rendered), which is true no
  // matter which module died or why.
  setTimeout(function () {
    try {
      var screenEl = document.getElementById('screen');
      var alive = screenEl && screenEl.children.length > 0;
      if (alive) { sessionStorage.removeItem(KEY); return; }
      if (sessionStorage.getItem(KEY)) return;      // already tried once this session
      sessionStorage.setItem(KEY, '1');
      var u = location.href.split('#')[0];
      location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'bhgr=' + Date.now() + location.hash);
    } catch (e) { /* private mode, storage denied: better to do nothing than to loop */ }
  }, 12000);
})();
</script>
</body>
</html>
